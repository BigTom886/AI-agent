spring:
  application:
    name: wc-ai-agent
  ai:
    openai:
      api-key: sk-922519c8fc75440d81c81d5fcb766dfe
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: kimi-k2.7-code
      # DashScope 的 OpenAI 兼容接口没有 text-embedding-ada-002；
      # 这里指定 DashScope 的 text-embedding-v3（维度 1024，可按需改 v1/v2）
      embedding:
        options:
          model: qwen3.7-text-embedding
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        # 关闭 stdio 示例，避免启动时去找那个不存在的 npx 命令
        stdio:
          enabled: false
        # SSE 连接列表（Spring AI 自动注入 ToolCallbackProvider）
        # 重要：url 只写 baseUrl，sse-endpoint 单独配；否则默认会拼成 /sse/sse
        sse:
          connections:
            pexels-search:
              url: http://localhost:8081        # 服务端 baseUrl
              sse-endpoint: /sse                 # 与服务端 spring.ai.mcp.server.sse-endpoint 默认值一致
        # 可选：客户端公共配置
        # name: wc-ai-agent-client
        # version: 1.0.0
        # request-timeout: 30s
        # initialized: true   # 启动时立即调用 initialize()

  datasource:
    url: jdbc:postgresql://localhost:5432/wc_ai_agent
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver


# 日志级别配置：确保 com.wc 包下的 INFO 日志能正常输出
logging:
  level:
    root: INFO
    com.wc: DEBUG
server:
  port: 8222
  servlet:
    context-path: /api


# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wc.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

# searchApi
search-api:
  api-key: dmAYH68bQWPghMrU7Cq3oyzZ
