spring:
  application:
    name: wc-ai-agent
  profiles:
    # 本地开发默认加载 application-local.yml（已 gitignore，存放真实密钥）；
    # 云端通过启动参数 --spring.profiles.active=prod 覆盖，不加载该文件
    active: local
  ai:
    openai:
      # 不要把真实 key 写在这里：本地走 application-local.yml，生产走环境变量
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: glm-5.2
      # DashScope 的 OpenAI 兼容接口没有 text-embedding-ada-002；
      # 这里指定 DashScope 的 text-embedding-v3（维度 1024，可按需改 v1/v2）
      embedding:
        options:
          model: qwen3.7-text-embedding
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        # 本地 stdio 连接：由本应用自动拉起 MCP 服务端子进程（java -jar），
        # 通过标准输入/输出通信，无需手动启动 8081 服务，也不占用 HTTP 端口
        stdio:
          enabled: true
          connections:
            pexels-search:
              command: java
              args:
                - -jar
                # 指向 mcp-search 打包后的可执行 jar（先对该模块执行 mvn package）
                - D:/Study/AI-agent/wc-ai-agent/wc-ai-agent-mcp-search/target/wc-ai-agent-mcp-search-1.0-SNAPSHOT.jar
        # SSE 远程连接已停用；如需切回，删掉上面的 stdio 配置，改回：
        # sse:
        #   connections:
        #     pexels-search:
        #       url: http://localhost:8081
        #       sse-endpoint: /sse
        # MCP 工具调用超时：stdio 对端是独立 JVM 子进程，有冷启动开销，
        # 加上 Pexels 国内访问慢（服务端自身 15s 超时），保留 30s
        request-timeout: 30s
        # initialized: true   # 启动时立即调用 initialize() 握手，能更早暴露配置错误

  datasource:
    url: jdbc:postgresql://localhost:5432/wc_ai_agent
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver


# 日志级别配置：确保 com.wc 包下的 INFO 日志能正常输出
logging:
  level:
    root: INFO
    com.wc: DEBUG
server:
  port: 8222
  servlet:
    context-path: /api


# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wc.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

# searchApi（本地走 application-local.yml，生产走环境变量 SEARCH_API_KEY）
search-api:
  api-key: ${SEARCH_API_KEY:}
