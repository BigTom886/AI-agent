spring:
  application:
    name: wc-ai-agent-mcp-search
  main:
    # stdio 模式不是 Web 服务；classpath 上有 webflux（WebClient 用），
    # 不显式声明为 none 的话 Spring Boot 仍会拉起 Netty 容器
    web-application-type: none
    # banner 会输出到 stdout，污染 MCP 的 JSON-RPC 通道，必须关闭
    banner-mode: off
  ai:
    mcp:
      server:
        name: wc-pexels-search
        version: 1.0.0
        # 启用 STDIO 传输：通过标准输入/输出与客户端（wc-ai-agent-app）通信
        stdio: true

pexels:
  api-key: PSIosCclH4VfOaqK1BLURsMGl9Wt9TRsIdIiS2r6qIrvnYxw1PzqbHJr   # 建议改为 ${PEXELS_API_KEY} 从环境变量读取
  base-url: https://api.pexels.com

# 注意：stdio 模式下 stdout 是协议通道，所有日志必须走 stderr
# 具体见 logback-spring.xml
logging:
  level:
    com.wc.mcp.search: INFO
    org.springframework.ai.mcp: INFO
